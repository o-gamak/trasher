# config/config.yaml
api:
  sandbox: true
  timeout: 15
  retries: 3
  request_delay: 0.2
  price_batch_size: 200
  price_batch_delay: 1.0

scanner:
  currency: "rub"
  max_ytm_annual: 100.0
  min_months: 6
  max_months: 24
  min_ytm_annual: 20.0        # Минимальный порог входа
  medium_ytm_threshold: 30.0  # Для расчета Junk Score
  junk_ytm_threshold: 40.0    # Всё что выше — "чистый мусор"

portfolio:
  budget: 100000              # Твой условный бюджет
  slots: 30                   # Количество разных бумаг (диверсификация)
  max_per_issuer: 3           # Не более 1 бумаги от одного эмитента
  issuer_key_length: 10       # Длина ключа для сравнения имен эмитентов
  dry_run: true               # true - только имитация покупки

output:
  dir: "../results"
  excel_file: "junk_analysis.xlsx"
  top_n_excel: 100
  preview_rows: 15
  save_csv: true

app:
  log_level: "INFO"
  confirm: true  
  load_data: true             # Ручное подтверждение перед "покупкой"